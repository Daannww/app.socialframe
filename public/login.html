<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inloggen — Order Dashboard</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css?v=2">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
  }
  .login-card {
    background: #000000;
    border-radius: 16px;
    padding: 40px 36px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.18);
    text-align: center;
  }
  .login-logo {
    height: 48px;
    width: auto;
    margin-bottom: 28px;
    filter: invert(1);
  }
  .login-card h1 {
    font-size: 16px;
    color: #ffffff;
    font-weight: 600;
    margin: 0 0 24px 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .login-field {
    text-align: left;
    margin-bottom: 16px;
  }
  .login-field label {
    display: block;
    font-size: 12px;
    color: #cbd5e1;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .login-field input {
    width: 100%;
    padding: 11px 14px;
    border-radius: 8px;
    border: 1px solid #3a3a3a;
    font-size: 14px;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.15s ease;
    background: #ffffff;
    color: var(--text);
  }
  .login-field input:focus { border-color: var(--blue); }
  .login-submit {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    border: none;
    border-radius: 8px;
    background: #ffffff;
    color: #000000;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .login-submit:hover { background: #e5e5e5; }
  .login-submit:disabled { opacity: 0.6; cursor: default; }
  .login-error {
    background: #fee2e2;
    color: #b91c1c;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .login-error.visible { display: block; }
</style>
</head>
<body>

<div class="login-card">
  <img src="logo.svg" alt="Socialframe" class="login-logo">
  <h1>Order Dashboard</h1>

  <div class="login-error" id="loginError"></div>

  <form id="loginForm">
    <div class="login-field">
      <label for="username">Gebruikersnaam</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="login-field">
      <label for="password">Wachtwoord</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="login-submit" id="loginSubmit">Inloggen</button>
  </form>
</div>

<script>
const form = document.getElementById('loginForm');
const errorEl = document.getElementById('loginError');
const submitBtn = document.getElementById('loginSubmit');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.classList.remove('visible');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Bezig...';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Inloggen mislukt');
    window.location.href = '/';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.add('visible');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Inloggen';
  }
});
</script>

</body>
</html>
